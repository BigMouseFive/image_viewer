server:
  # 外部 AI 修图 API 当前不要求 token；默认仅本机监听，避免未认证写入口暴露到局域网。
  host: 127.0.0.1
  port: 8700
images:
  # 目录选择器只能访问此目录及其子目录
  allowed_root_dir: ..
  default_source:
    name: UAE A+ 图片
    path: ../ai-relay/outputs/aplus_images_uae
  scan_interval_seconds: 5

aplus_tool:
  # A+ Tool 的交付接收地址；未配置或不可达时不会影响图片审核。
  url: http://127.0.0.1:8900
  # 必须与 aplus_tool/.env 的 IMAGE_REVIEWER_SYNC_TOKEN 相同；仅用于本机/可信局域网同步。
  sync_token: change-me-before-network-use
  request_timeout_seconds: 30

iopaint:
  enabled: true
  url: http://127.0.0.1:5055
  backup_before_edit: true
  request_timeout_seconds: 5

product_info:
  csv: ../ai-relay/products_amazon_info_202609021610.csv

aplus_prompts:
  # 原始生图提示词；AI 修改任务接口按 SKU + A+L01~A+L05 返回对应 prompt。
  csv: ../ai-relay/outputs/aplus_prompts_20260903.csv

ai_revision:
  # 前端 Cursor ACP 入口已移除；外部 AI 通过 /api/ai/revision-tasks 和本项目 Skill 工作。
  # 如确实需要恢复旧的本地 Worker，可手动设为 true。
  enabled: false
  runner: cursor_acp
  agent_command: agent
  # Cursor ACP 当前实际返回 auto-smart[optimize_for=balanced]（界面名称 Auto Balance）。
  model_policy: auto
  max_concurrency: 1
  max_attempts: 2
  task_timeout_seconds: 1200
  poll_interval_seconds: 3
  auto_apply: true
  workspace_root: data/ai-jobs
